# Noise-suppressed microphone as a virtual source "Clean microphone", run as its own process (like the equalizer):
#   pipewire -c ~/.cache/quickshell/qs-mic.conf     (the shell fills in @TARGET@ with the real microphone's node name)
# WebRTC noise suppression and a high-pass filter; no echo cancelling (there is no reference signal here).
# Stopping the process removes the source; nothing system-wide is touched.
context.properties = { log.level = 2 }
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { nice.level = -11 } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = false
            aec.args = {
                webrtc.noise_suppression = true
                webrtc.high_pass_filter  = true
                webrtc.gain_control      = false
                webrtc.extended_filter   = false
                webrtc.voice_detection   = false
            }
            capture.props = {
                node.name   = "qs_mic_capture"
                node.target = "@TARGET@"
                node.passive = true
            }
            source.props = {
                node.name        = "qs_mic"
                node.description = "Clean microphone"
                media.class      = Audio/Source
            }
            sink.props = {
                node.name        = "qs_mic_sink"
                node.description = "Clean microphone (reference)"
                media.class      = Audio/Sink
                priority.session = 0
                priority.driver  = 0
            }
            playback.props = { node.name = "qs_mic_playback" node.passive = true }
        }
    }
]
