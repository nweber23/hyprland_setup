# Portals for the Hyprland session: screen sharing and screenshots through wlroots' portal, everything else
# (file chooser, settings, ...) through the GTK portal. Needs the package xdg-desktop-portal-wlr.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
